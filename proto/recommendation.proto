syntax = "proto3";
package recommendation;

service RecommendationService {
  // На вход подаем лайки, на выходе — рекомендации
  rpc GetRecommendedArticles (RecommendationRequest) returns (RecommendationResponse);
}

message Like {
  int32 user_id = 1;
  int32 article_id = 2;
}

message RecommendationRequest {
  int32 target_article_id = 1;
  repeated Like all_likes = 2;
}

message RecommendedArticle {
  int32 article_id = 1;
  int32 score = 2;
}

message RecommendationResponse {
  repeated RecommendedArticle articles = 1;
}